kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true      # Calico provides networking AND NetworkPolicy enforcement (kindnet does not enforce)
  podSubnet: 192.168.0.0/16    # Calico's default pod range
nodes:
  - role: control-plane
  - role: worker
  - role: worker
