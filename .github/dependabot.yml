# Keeps the pinned (SHA) actions, Python packages and the base image up to date through reviewed pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /app
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /app
    schedule: {interval: weekly}
